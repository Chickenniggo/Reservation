name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reservations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservations_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_TEST_CONNECTION: Host=localhost;Database=reservations_test;Username=postgres;Password=isolated-ci-test-only;Max Auto Prepare=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore tests/Reservations.Api.Tests/Reservations.Api.Tests.csproj --locked-mode
      - name: Test
        run: dotnet test tests/Reservations.Api.Tests/Reservations.Api.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results
      - name: Publish
        run: dotnet publish src/Reservations.Api/Reservations.Api.csproj -c Release --no-restore -o artifacts/publish /p:UseAppHost=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: error

  integration:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4.3.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: reservations-ci
          wait: 120s
      - name: Build and inspect container
        run: |
          docker build -t reservations-api:local .
          docker run --rm --entrypoint sh reservations-api:local -c 'test "$(id -u)" != 0 && test -z "$(dotnet --list-sdks)"'
          kind load docker-image reservations-api:local --name reservations-ci
      - name: Install ingress
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik --namespace ingress --create-namespace --set ingressClass.enabled=false --wait --timeout 5m
      - name: Start biletado
        run: |
          mkdir -p artifacts/cluster
          kubectl create namespace biletado
          kubectl apply -k deploy -n biletado
          kubectl rollout status deployment/postgres -n biletado --timeout=180s
          kubectl rollout status deployment/keycloak -n biletado --timeout=300s
          kubectl rollout status deployment/assets -n biletado --timeout=300s
          kubectl rollout status deployment/reservations -n biletado --timeout=180s
          kubectl port-forward -n ingress service/traefik 9090:80 > artifacts/cluster/port-forward.log 2>&1 &
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:9090/api/v4/reservations/health/ready
      - name: Run official v4 tests
        run: |
          git clone https://gitlab.com/biletado/apidocs.git "$RUNNER_TEMP/apidocs"
          git -C "$RUNNER_TEMP/apidocs" checkout fa1d632edde44e8c68da7e2938bb400e2b76bbee
          node scripts/prepare-httpyac.cjs "$RUNNER_TEMP/apidocs"
          cd "$RUNNER_TEMP/apidocs/httpyac"
          npm ci
          npx httpyac send 400_ReadReservationsPublic-v4.http 500_WriteReservationsPublic-v4.http 550_ReadWriteReservationsAuth-v4.http 560_ReadWriteReservationsETag-v4.http --all --junit > "$GITHUB_WORKSPACE/artifacts/cluster/httpyac.xml"
      - name: Collect cluster logs
        if: always()
        run: |
          mkdir -p artifacts/cluster
          kubectl get pods -A -o wide > artifacts/cluster/pods.txt
          kubectl get events -n biletado --sort-by=.lastTimestamp > artifacts/cluster/events.txt
          kubectl logs -n biletado deployment/reservations --all-containers > artifacts/cluster/reservations.log 2>&1 || true
          kubectl logs -n biletado deployment/assets --all-containers > artifacts/cluster/assets.log 2>&1 || true
          kubectl logs -n biletado deployment/keycloak --all-containers > artifacts/cluster/keycloak.log 2>&1 || true
          kubectl describe deployment/reservations -n biletado > artifacts/cluster/deployment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-integration
          path: artifacts/cluster/

  image:
    needs: [test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/chickenniggo/reservation:${{ github.sha }}
            ghcr.io/chickenniggo/reservation:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Chickenniggo/Reservation
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max